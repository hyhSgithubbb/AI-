<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>윷판 한마당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 한가위 밤하늘 한 가지 세계로만 그립니다 (라이트/다크 공통) */
:root{
  --night:#1D2046; --night-2:#2D2A5E; --moon:#FFE08A; --moon-glow:rgba(255,224,138,.45);
  --cream:#FFF3DA; --cream-dim:#CFC3E6;
  --rice:#FFF8EE; --rice-2:#F7ECDD; --rice-3:#EFDFCB;
  --ink:#43354F; --muted:#8B7A8E; --line:#EAD9C6;
  --plum:#5B4A86; --gold:#FFCF5C; --gold-d:#E0A035; --red:#F0506E;
  --board-line:#D8B48E; --label:#B08463;
  --shadow:0 2px 0 rgba(30,20,60,.08),0 10px 28px rgba(10,8,40,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;color:var(--ink);padding-inline:16px;
  font:15px/1.55 "Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff 60%,transparent 61%),
    radial-gradient(1px 1px at 28% 8%,#fff 60%,transparent 61%),
    radial-gradient(1.5px 1.5px at 46% 22%,#ffeebb 60%,transparent 61%),
    radial-gradient(1px 1px at 63% 12%,#fff 60%,transparent 61%),
    radial-gradient(2px 2px at 82% 30%,#fff 60%,transparent 61%),
    radial-gradient(1px 1px at 91% 9%,#fff 60%,transparent 61%),
    radial-gradient(1px 1px at 7% 52%,#fff 60%,transparent 61%),
    radial-gradient(1.5px 1.5px at 96% 58%,#ffeebb 60%,transparent 61%),
    radial-gradient(1px 1px at 38% 70%,#fff 60%,transparent 61%),
    radial-gradient(1px 1px at 72% 84%,#fff 60%,transparent 61%),
    radial-gradient(60% 40% at 15% 0%,rgba(255,224,138,.12),transparent 70%),
    linear-gradient(180deg,var(--night) 0%,var(--night-2) 100%);
  background-attachment:fixed;
  background-color:var(--night);
}
.wrap{max-width:1200px;margin:0 auto;padding-block:18px 56px}
.jua{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400}

/* ---------- header ---------- */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.moon{width:118px;height:118px;flex:none;filter:drop-shadow(0 0 26px var(--moon-glow))}
h1{margin:0;color:var(--cream);font:400 46px/1 "Jua",sans-serif;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:8px 0 0;color:var(--cream-dim);font-size:14px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;gap:2px}
.seg button,.pill{border:0;font:400 16px "Jua",sans-serif;color:var(--cream);background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.pill{background:rgba(255,255,255,.1);display:inline-flex;align-items:center;gap:6px}
.pill svg{width:16px;height:16px}
.pill[aria-pressed="false"]{opacity:.55}
.pill.danger{background:var(--red);color:#fff}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:1fr}}

/* ---------- board ---------- */
.board-card{
  position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px);
  background:var(--rice);border-radius:28px;padding:14px;box-shadow:var(--shadow);
  outline:2px dashed #F1C9D2;outline-offset:-10px;overflow:hidden;
}
@media (max-width:900px){.board-card{position:static}}
.board-card svg#board{display:block;width:100%;height:auto;max-width:100%;position:relative;z-index:1}
.board-line{stroke:var(--board-line);stroke-width:3.5;fill:none;stroke-linecap:round}
.node-shadow{fill:var(--rice-3)}
.node{fill:#fff;stroke:#E9CFB2;stroke-width:2.5}
.dduk-pink{fill:#FFE3EA;stroke:#F2B3C3;stroke-width:3}
.dduk-moon{fill:#FFE8A6;stroke:#F1C45E;stroke-width:3}
.dduk-pat{fill:none;stroke:rgba(180,110,120,.45);stroke-width:1.6}
.corner-label{fill:var(--label);font:400 17px "Jua",sans-serif}
.dir{fill:var(--board-line)}
.piece .hop{transform-box:fill-box;transform-origin:center bottom}
.piece.movable{cursor:pointer}
.piece.movable .hop{animation:hop .9s ease-in-out infinite}
.piece.movable .ring{fill:none;stroke:var(--plum);stroke-width:2.5;stroke-dasharray:4 5;animation:spin 4s linear infinite;transform-box:fill-box;transform-origin:center}
.piece.aim{cursor:crosshair}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.ghost .g-ring{fill:none;stroke:var(--plum);stroke-width:3;stroke-dasharray:3 5}
.ghost text{font:400 16px "Jua",sans-serif;fill:var(--plum)}
.ghost .aim-ring{fill:none;stroke:var(--red);stroke-width:3}
.ghost .aim-tick{stroke:var(--red);stroke-width:3;stroke-linecap:round}
.ghost .aim-dot{fill:var(--red)}
.ghost .aim-label{fill:var(--red)}
.ghost .aim-spin{animation:spin 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
.fx-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.hit{position:absolute;left:50%;top:46%;z-index:3;pointer-events:none;text-align:center;transform:translate(-50%,-50%);opacity:0;white-space:nowrap}
.hit b{display:block;font:400 76px/1 "Jua",sans-serif;color:#fff;
  text-shadow:3px 0 0 var(--red),-3px 0 0 var(--red),0 3px 0 var(--red),0 -3px 0 var(--red),3px 3px 0 var(--red),-3px -3px 0 var(--red),3px -3px 0 var(--red),-3px 3px 0 var(--red),0 8px 0 rgba(67,53,79,.35)}
.hit span{display:inline-block;margin-top:10px;font:400 18px "Jua",sans-serif;color:#fff;background:var(--ink);padding:5px 14px;border-radius:999px}
.killfeed{position:absolute;top:20px;right:20px;z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.kf{display:flex;align-items:center;gap:6px;background:rgba(29,32,70,.86);color:#fff;border-radius:8px;padding:5px 10px;font:400 14px "Jua",sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.kf svg{width:26px;height:20px}
.kf .x{width:16px;height:16px}

/* ---------- side panel ---------- */
.panel{display:grid;gap:16px}
.card{background:var(--rice);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.sect-title{margin:0 0 10px;font:400 15px "Jua",sans-serif;color:var(--muted);letter-spacing:.02em}
.turn{display:flex;align-items:center;gap:14px}
.turn svg{width:54px;height:42px;flex:none}
.turn-name{font:400 30px/1.1 "Jua",sans-serif}
.status{color:var(--muted);font-size:14px;margin-top:3px}

.throw{padding:0;overflow:hidden}
.mat{position:relative;height:236px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg,rgba(150,100,50,.13) 0 2px,transparent 2px 10px),
    repeating-linear-gradient(0deg,rgba(150,100,50,.09) 0 2px,transparent 2px 10px),
    radial-gradient(120% 100% at 50% 30%,#F4E0B6 0%,#E3C690 100%);}
.mat::after{content:"";position:absolute;inset:10px;border:2px dashed rgba(140,90,40,.28);border-radius:16px;pointer-events:none}
.pine{position:absolute;width:74px;height:60px;pointer-events:none;opacity:.9}
.pine.l{left:8px;bottom:6px}
.pine.r{right:8px;top:6px;transform:scale(-1,-1)}
.stick{position:absolute;top:54px;width:24px;height:128px;margin-left:-12px;will-change:transform;z-index:1}
.stick svg{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 5px rgba(90,52,23,.35))}
@keyframes pop{0%{transform:scale(.2) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.throw-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;flex-wrap:wrap}
.throw-btn{border:0;font:400 25px "Jua",sans-serif;padding:12px 28px;border-radius:999px;cursor:pointer;background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-d);transition:transform .08s,box-shadow .08s}
.throw-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.throw-btn:disabled{opacity:.4;cursor:not-allowed}
.pending{font-size:14px;color:var(--muted)}
.pending strong{color:var(--ink);font-family:"Jua",sans-serif;font-weight:400;font-size:18px}

.results{display:flex;flex-wrap:wrap;gap:8px;min-height:42px}
.res{border:0;font:400 18px "Jua",sans-serif;padding:7px 16px;border-radius:999px;background:var(--rice-2);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.res small{font-family:"Gowun Dodum",sans-serif;font-size:12px;opacity:.7}
.res[aria-pressed="true"]{background:var(--plum);color:#fff}
.res.back{box-shadow:inset 0 0 0 2px var(--red)}
.empty{color:var(--muted);font-size:14px;align-self:center}

.teams{display:grid;gap:10px}
.team{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:16px;background:var(--rice-2)}
.team.now{box-shadow:inset 0 0 0 3px var(--team)}
.team-name{font:400 19px "Jua",sans-serif;display:flex;align-items:center;gap:8px}
.team-name small{font:13px "Gowun Dodum",sans-serif;color:var(--muted)}
.score{display:flex;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{font:400 17px "Jua",sans-serif;color:var(--ink)}
.home{display:flex;gap:6px;grid-column:1 / -1;flex-wrap:wrap}
.hp{width:44px;height:36px;border:0;padding:0;background:transparent;border-radius:12px;display:grid;place-items:center}
.hp svg{width:40px;height:32px}
.hp.out svg,.hp.done svg{opacity:.28}
.hp.done{background:repeating-linear-gradient(135deg,rgba(255,207,92,.35) 0 4px,transparent 4px 8px)}
.hp.movable{cursor:pointer;background:#fff;box-shadow:0 0 0 2px var(--plum)}
.hp.movable svg{animation:hop .9s ease-in-out infinite}
.hp.incoming svg{opacity:0}

.btn{border:0;font:400 17px "Jua",sans-serif;padding:9px 18px;border-radius:999px;cursor:pointer;background:var(--plum);color:#fff}

/* ---------- screen fx ---------- */
.flash,.vignette{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:50}
.flash{background:#fff}
.vignette{background:radial-gradient(ellipse at center,transparent 45%,rgba(240,80,110,.55) 100%)}
.flyer{position:fixed;left:0;top:0;width:44px;height:36px;margin:-18px 0 0 -22px;pointer-events:none;z-index:60}
.flyer svg{width:100%;height:100%}

@media (prefers-reduced-motion: reduce){
  .piece.movable .hop,.hp.movable svg,.piece.movable .ring,.ghost .aim-spin{animation:none}
}

/* ---------- v3: 한눈에 보는 배치 · 게이지 · 결과창 · 설정창 ---------- */
.card.top{display:grid;gap:12px}
.turn .btn{margin-left:auto}
.gauge-wrap{padding:12px 18px 0}
.gauge-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:6px}
.gauge-head b{font:400 18px "Jua",sans-serif;color:var(--ink)}
.gauge{position:relative;display:flex;height:30px;border-radius:999px;background:var(--rice-2);box-shadow:inset 0 0 0 2px var(--rice-3)}
.gauge .z{display:grid;place-items:center;font:400 13px "Jua",sans-serif;color:var(--ink)}
.gauge .z1{width:33%;background:#CDEBD3;border-radius:999px 0 0 999px}
.gauge .z2{width:33%;background:#FFE7A6}
.gauge .z3{width:24%;background:#FFC3D2}
.gauge .z4{width:10%;background:#F0506E;color:#fff;border-radius:0 999px 999px 0}
.gauge .needle{position:absolute;top:-5px;bottom:-5px;left:50%;width:8px;margin-left:-4px;border-radius:4px;background:var(--ink);box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.3)}
.gauge.idle{opacity:.45}
.hint{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
kbd{font:400 14px "Jua",sans-serif;color:var(--ink);background:#fff;border:1px solid var(--rice-3);border-bottom-width:3px;border-radius:7px;padding:1px 9px}
.teams{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.team-name small{font-size:12px}
.yt{width:128px;height:72px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.yt iframe{display:block;width:100%;height:100%}

.result-pop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;
  background:rgba(22,20,52,.38);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer}
.rp-card{text-align:center;display:flex;flex-direction:column;align-items:center}
.rp-who{margin:0;font:400 24px "Jua",sans-serif;color:var(--cream)}
.rp-card b{font:400 clamp(120px,20vw,240px)/1 "Jua",sans-serif;
  text-shadow:6px 0 0 var(--ink),-6px 0 0 var(--ink),0 6px 0 var(--ink),0 -6px 0 var(--ink),5px 5px 0 var(--ink),-5px -5px 0 var(--ink),5px -5px 0 var(--ink),-5px 5px 0 var(--ink),0 14px 0 rgba(20,14,40,.35)}
.rp-sub{margin-top:14px;font:400 20px "Jua",sans-serif;color:#fff;background:var(--ink);padding:6px 18px;border-radius:999px}
.rp-sticks{display:flex;gap:14px;margin-top:22px}
.rp-sticks svg{width:26px;height:140px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}

.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(22,20,52,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal-card{width:min(460px,100%);background:var(--rice);border-radius:26px;padding:24px;display:grid;gap:14px;box-shadow:var(--shadow)}
.modal-card h2{margin:0;font:400 32px/1.1 "Jua",sans-serif}
.modal-card p{margin:0;color:var(--muted);font-size:14px}
.modal .seg{background:var(--rice-2);justify-self:start}
.modal .seg button{color:var(--ink)}
.names{display:grid;gap:10px}
.name-row{display:grid;grid-template-columns:44px 72px 1fr;align-items:center;gap:8px;font:400 15px "Jua",sans-serif;color:var(--muted)}
.name-row svg{width:44px;height:34px}
.name-row input{font:16px "Gowun Dodum",sans-serif;color:var(--ink);background:#fff;border:2px solid var(--rice-3);border-radius:12px;padding:9px 12px;min-width:0}
.name-row input:focus{outline:none;border-color:var(--plum)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.btn.ghost{background:var(--rice-2);color:var(--ink)}
.btn.primary{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d)}
.pill[aria-pressed="true"]#fsBtn{opacity:1}
#fsBtn[aria-pressed="false"]{opacity:1}

/* 넓은 화면: 판 + 패널이 한 화면에 */
@media (min-width:1000px){
  :root{--bs:min(calc(100dvh - 128px), 60vw)}
  .wrap{max-width:none;padding-block:12px}
  header{height:80px;margin-bottom:12px;flex-wrap:nowrap}
  .moon{width:72px;height:72px}
  h1{font-size:34px}
  .brand p{margin-top:4px;font-size:13px}
  .app{grid-template-columns:var(--bs) minmax(0,1fr);max-width:calc(var(--bs) + 760px);margin-inline:auto}
  .board-card{position:static;width:var(--bs);height:var(--bs);padding:10px}
  .board-card svg#board{height:100%}
  .panel{max-height:var(--bs);overflow:auto;gap:12px;align-content:start}
  .card{padding:14px 16px}
  .mat{height:clamp(150px,20dvh,200px)}
  .stick{top:calc(50% - 64px)}
  header .wrap-brand{min-width:0}
}
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div class="vignette" id="vignette"></div>
<div class="wrap" id="wrap">
  <header>
    <div class="brand">
      <svg class="moon" viewBox="0 0 160 160" aria-hidden="true">
        <circle cx="80" cy="80" r="74" fill="#FFE08A"/>
        <circle cx="80" cy="80" r="74" fill="none" stroke="#FFF1C4" stroke-width="3" opacity=".7"/>
        <circle cx="46" cy="42" r="9" fill="#F7CF6C" opacity=".55"/>
        <circle cx="118" cy="52" r="6" fill="#F7CF6C" opacity=".55"/>
        <circle cx="122" cy="96" r="4" fill="#F7CF6C" opacity=".55"/>
        <!-- 절구와 떡 -->
        <path d="M63 118 L97 118 L92 146 L68 146 Z" fill="#B07A4F"/>
        <rect x="58" y="111" width="44" height="10" rx="5" fill="#C9925F"/>
        <ellipse cx="80" cy="111" rx="15" ry="6" fill="#fff"/>
        <g id="rabbit">
          <ellipse cx="36" cy="126" rx="17" ry="19" fill="#fff" stroke="#6B5A7A" stroke-width="2.5"/>
          <ellipse cx="33" cy="72" rx="5" ry="16" transform="rotate(-14 33 72)" fill="#fff" stroke="#6B5A7A" stroke-width="2.5"/>
          <ellipse cx="33" cy="74" rx="2" ry="10" transform="rotate(-14 33 74)" fill="#FFB7C8"/>
          <ellipse cx="45" cy="71" rx="5" ry="16" transform="rotate(10 45 71)" fill="#fff" stroke="#6B5A7A" stroke-width="2.5"/>
          <ellipse cx="45" cy="73" rx="2" ry="10" transform="rotate(10 45 73)" fill="#FFB7C8"/>
          <circle cx="42" cy="97" r="14" fill="#fff" stroke="#6B5A7A" stroke-width="2.5"/>
          <circle cx="48" cy="95" r="2" fill="#43354F"/>
          <ellipse cx="50" cy="101" rx="3.2" ry="2" fill="#FF9DB4"/>
          <path d="M53 98 q2 1.5 0 3" stroke="#6B5A7A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <g>
            <line x1="46" y1="116" x2="74" y2="104" stroke="#8B5A35" stroke-width="3.5" stroke-linecap="round"/>
            <rect x="70" y="94" width="11" height="18" rx="3" fill="#8B5A35" transform="rotate(-22 75 103)"/>
            <animateTransform attributeName="transform" type="rotate" values="-38 46 116;4 46 116;0 46 116;-38 46 116" keyTimes="0;0.42;0.5;1" dur="1.2s" repeatCount="indefinite"/>
          </g>
          <ellipse cx="46" cy="117" rx="5" ry="4" fill="#fff" stroke="#6B5A7A" stroke-width="2"/>
        </g>
        <g transform="translate(160 0) scale(-1 1)">
          <use href="#rabbit"/>
        </g>
      </svg>
      <div>
        <h1>윷판 한마당</h1>
        <p>한가위 달토끼 윷놀이 · 2~4팀 · 팀당 송편 말 4개</p>
      </div>
    </div>
    <div class="controls">
      <div class="yt" id="ytWrap" hidden title="배경음 플레이어"><div id="ytHost"></div></div>
      <button type="button" class="pill" id="newGame">새 게임</button>
      <button type="button" class="pill" id="bgmBtn" aria-pressed="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 12.5V3l7-1.5v9" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="4.3" cy="12.5" r="2" fill="currentColor"/><circle cx="11.3" cy="10.5" r="2" fill="currentColor"/></svg>배경음</button>
      <button type="button" class="pill" id="fileBtn" title="내 음악 파일을 배경음으로">음악 파일</button>
      <input type="file" id="fileInput" accept="audio/*" hidden>
      <button type="button" class="pill" id="sfxBtn" aria-pressed="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11.5 5.5q1.5 2.5 0 5M13.5 4q2.5 4 0 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>효과음</button>
      <button type="button" class="pill" id="fsBtn" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>전체 화면</button>
    </div>
  </header>

  <main class="app">
    <section class="board-card" id="boardCard" aria-label="윷판">
      <svg id="board" viewBox="0 0 600 600" role="img" aria-label="윷놀이 판"></svg>
      <canvas class="fx-canvas" id="fx"></canvas>
      <div class="hit" id="hit"><b id="hitText"></b><span id="hitSub"></span></div>
      <div class="killfeed" id="killfeed" aria-live="polite"></div>
    </section>

    <aside class="panel">

<script>
(() => {
  // ================= 설정 =================
  const TEAMS = [
    { name: '분홍송편', color: '#F7A8BC', edge: '#D9728F' },
    { name: '쑥송편',   color: '#9ACD8F', edge: '#5F9C5A' },
    { name: '호박송편', color: '#FFD36E', edge: '#D9A034' },
    { name: '자색송편', color: '#BCA3EA', edge: '#8466C4' },
  ];
  const RESULT = {
    '-1': { name: '빽도', sub: '한 칸 뒤로', color: '#FF8FA3' },
    1: { name: '도', sub: '1칸', color: '#FFFFFF' },
    2: { name: '개', sub: '2칸', color: '#C9F0B8' },
    3: { name: '걸', sub: '3칸', color: '#FFE08A' },
    4: { name: '윷', sub: '4칸 · 한 번 더!', color: '#FFB3C7' },
    5: { name: '모', sub: '5칸 · 한 번 더!', color: '#FFD65C' },
  };
  const HOME = -1, FIN = 99, PIECES = 4;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 80) : ms));
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // ================= 소리 (Web Audio 합성) =================
  const Sound = (() => {
    let ctx = null, comp, sfxBus, bgmBus, noiseBuf;
    let sfxOn = store.get('yut.sfx', true), bgmOn = store.get('yut.bgm', true);
    const BGM_VOL = 0.55;

    function init() {
      if (ctx) return true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      const master = ctx.createGain(); master.gain.value = 0.9;
      comp.connect(master); master.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(comp);
      bgmBus = ctx.createGain(); bgmBus.gain.value = 0.0001; bgmBus.connect(comp);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return true;
    }
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    function env(g, t0, a, dur, vol) {
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    }
    function tone(o, bus) {
      const t0 = (o.at ?? ctx.currentTime) + (o.t || 0);
      const osc = ctx.createOscillator();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.f, t0);
      if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + (o.slide || o.dur));
      const g = ctx.createGain();
      env(g, t0, o.a || 0.005, o.dur, o.vol || 0.3);
      let n = osc;
      if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); n = f; }
      n.connect(g); g.connect(bus || sfxBus);
      osc.start(t0); osc.stop(t0 + o.dur + 0.05);
    }
    function noise(o, bus) {
      const t0 = (o.at ?? ctx.currentTime) + (o.t || 0);
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const f = ctx.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.Q || 1;
      f.frequency.setValueAtTime(o.f, t0);
      if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + o.dur);
      const g = ctx.createGain(); env(g, t0, o.a || 0.003, o.dur, o.vol || 0.3);
      src.connect(f); f.connect(g); g.connect(bus || sfxBus);
      src.start(t0, Math.random() * 0.5); src.stop(t0 + o.dur + 0.05);
    }
    const fx = fn => (...args) => { if (ctx && sfxOn) fn(...args); };

    // ---- 효과음 ----
    const SFX = {
      click: fx(() => tone({ f: 880, f2: 1320, dur: .06, vol: .1 })),
      whoosh: fx(() => noise({ f: 350, f2: 2600, dur: .4, Q: 1.2, vol: .35 })),
      clack: fx(t => {
        noise({ t, f: 2000 + Math.random() * 900, Q: 10, dur: .09, vol: .7 });
        tone({ t, type: 'triangle', f: 700 + Math.random() * 400, dur: .08, vol: .14 });
      }),
      result: fx(r => {
        if (r < 0) {
          tone({ type: 'sawtooth', f: 520, f2: 110, dur: .7, vol: .16, lp: 1100 });
          tone({ t: .05, type: 'sine', f: 260, f2: 70, dur: .6, vol: .2 });
          return;
        }
        const scale = [79, 81, 84, 86, 88, 91, 93];
        if (r <= 3) {
          for (let i = 0; i < r + 1; i++) tone({ t: i * .07, type: 'triangle', f: mtof(scale[i + 1]), dur: .22, vol: .18 });
          return;
        }
        // 윷·모 : 신나는 상행 + 장구 한 번
        const seq = r === 5 ? [79, 81, 84, 86, 88, 91, 96] : [79, 84, 86, 88, 91];
        seq.forEach((m, i) => tone({ t: i * .06, type: 'triangle', f: mtof(m), dur: .25, vol: .18 }));
        tone({ t: seq.length * .06, type: 'triangle', f: mtof(seq[seq.length - 1] + 12), dur: .6, vol: .12 });
        tone({ f: 120, f2: 50, dur: .3, vol: .5 });
        noise({ t: .12, f: 2600, Q: 3, dur: .08, vol: .35 });
      }),
      step: fx(i => tone({ type: 'sine', f: 560 * Math.pow(1.12, i), f2: 840 * Math.pow(1.12, i), dur: .1, vol: .16 })),
      stack: fx(() => {
        tone({ f: 260, f2: 720, dur: .18, vol: .25, slide: .12 });
        tone({ t: .14, f: 720, f2: 520, dur: .25, vol: .18 });
      }),
      finish: fx(() => [79, 81, 84, 86, 88, 91].forEach((m, i) => tone({ t: i * .07, type: 'triangle', f: mtof(m), dur: .35, vol: .16 }))),
      lock: fx(() => {
        tone({ type: 'square', f: 1500, dur: .045, vol: .07 });
        tone({ t: .1, type: 'square', f: 1500, dur: .045, vol: .07 });
        tone({ t: .2, type: 'square', f: 2000, dur: .09, vol: .08 });
      }),
      shot: fx(() => {
        noise({ type: 'highpass', f: 2500, dur: .06, vol: .7 });                 // 탕
        noise({ type: 'lowpass', f: 7000, f2: 300, dur: .45, Q: .7, vol: .9 });   // 폭발
        tone({ f: 170, f2: 38, dur: .45, vol: .95 });                              // 쿵
        tone({ t: .02, type: 'square', f: 90, f2: 40, dur: .18, vol: .18, lp: 600 });
      }),
      hitmarker: fx(() => {
        tone({ t: .06, type: 'square', f: 2700, dur: .03, vol: .12 });
        tone({ t: .1, type: 'square', f: 3300, dur: .03, vol: .1 });
      }),
      whistle: fx(() => tone({ t: .12, f: 1500, f2: 420, dur: .55, vol: .1 })),
      oneMore: fx(() => [84, 88, 91].forEach((m, i) => tone({ t: .35 + i * .08, type: 'triangle', f: mtof(m), dur: .2, vol: .14 }))),
      multi: fx(n => {
        for (let k = 0; k < n; k++) noise({ t: .25 + k * .12, type: 'lowpass', f: 5000, f2: 400, dur: .25, vol: .6 });
        [67, 71, 74].forEach(m => tone({ t: .3, type: 'sawtooth', f: mtof(m), dur: .6, vol: .07, lp: 2400 }));
      }),
      win: fx(() => {
        const mel = [79, 81, 84, 86, 88, 86, 88, 91, 93, 96];
        mel.forEach((m, i) => tone({ t: i * .11, type: 'triangle', f: mtof(m), dur: .35, vol: .18 }));
        for (let i = 0; i < 6; i++) { tone({ t: i * .22, f: 120, f2: 50, dur: .25, vol: .45 }); noise({ t: i * .22 + .11, f: 2600, Q: 3, dur: .07, vol: .3 }); }
      }),
      duck() {
        if (!ctx || !timer) return;
        const t = ctx.currentTime;
        bgmBus.gain.cancelScheduledValues(t);
        bgmBus.gain.setValueAtTime(Math.max(bgmBus.gain.value, 0.0001), t);
        bgmBus.gain.exponentialRampToValueAtTime(0.1, t + 0.05);
        bgmBus.gain.exponentialRampToValueAtTime(BGM_VOL, t + 1.4);
      },
    };

    // ---- 배경음: 평조 가야금 선율 + 세마치 장단 ----
    // 음표: [MIDI, 8분음표 길이] · null 은 쉼표 · 한 마디 = 9개 8분음표(세마치)
    const MEL = [
      [74, 3], [76, 2], [74, 1], [72, 3],
      [69, 3], [72, 2], [69, 1], [67, 3],
      [69, 2], [72, 1], [74, 3], [76, 3],
      [74, 6], [null, 3],
      [79, 3], [76, 2], [74, 1], [76, 3],
      [74, 2], [72, 1], [69, 3], [72, 3],
      [69, 3], [67, 2], [64, 1], [67, 3],
      [67, 6], [null, 3],
      [76, 3], [79, 2], [76, 1], [74, 3],
      [72, 3], [74, 2], [72, 1], [69, 3],
      [72, 2], [74, 1], [76, 3], [74, 3],
      [72, 6], [null, 3],
      [69, 3], [72, 2], [74, 1], [76, 3],
      [74, 2], [76, 1], [74, 3], [72, 3],
      [69, 3], [72, 2], [69, 1], [67, 3],
      [67, 6], [null, 3],
    ];
    const SLOTS = [];
    { let s = 0; for (const [m, d] of MEL) { SLOTS[s] = m === null ? null : [m, d]; s += d; } SLOTS.length = s; }
    const TOTAL = SLOTS.length; // 144
    const JANGGU = ['덩', '', '', '덩', '', '덕', '쿵', '덕', ''];
    const BASS = [43, 50, 48, 43, 43, 50, 45, 43, 48, 43, 45, 48, 45, 50, 48, 43];
    const EIGHTH = 0.2;
    let timer = null, nextT = 0, step = 0;

    function pluck(m, t, dur, vol = .2) {
      const f = mtof(m);
      const g = ctx.createGain();
      const len = Math.min(dur + .7, 2.2);
      env(g, t, .004, len, vol);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
      lp.frequency.setValueAtTime(3600, t); lp.frequency.exponentialRampToValueAtTime(700, t + .35);
      const o1 = ctx.createOscillator(); o1.type = 'triangle';
      const o2 = ctx.createOscillator(); o2.type = 'sawtooth';
      const g2 = ctx.createGain(); g2.gain.value = .28;
      for (const o of [o1, o2]) {
        o.frequency.setValueAtTime(f * Math.pow(2, -60 / 1200), t);    // 밀어 올리는 시김새
        o.frequency.exponentialRampToValueAtTime(f, t + .07);
      }
      if (dur >= 3 * EIGHTH) {                                          // 농현(떨림)
        const lfo = ctx.createOscillator(); lfo.frequency.value = 5.2;
        const lg = ctx.createGain();
        lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + .22); lg.gain.linearRampToValueAtTime(f * .018, t + .5);
        lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
        lfo.start(t); lfo.stop(t + len);
      }
      o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(bgmBus);
      o1.start(t); o2.start(t); o1.stop(t + len); o2.stop(t + len);
    }
    function drum(kind, t) {
      if (kind === '덩' || kind === '쿵') tone({ at: t, f: 115, f2: 52, dur: .28, vol: kind === '덩' ? .5 : .4 }, bgmBus);
      if (kind === '덩' || kind === '덕') noise({ at: t, f: 2400, Q: 2.5, dur: .07, vol: .28 }, bgmBus);
    }
    function schedule() {
      while (nextT < ctx.currentTime + 0.3) {
        const n = SLOTS[step];
        if (n) pluck(n[0], nextT, n[1] * EIGHTH);
        const beat = step % 9;
        if (JANGGU[beat]) drum(JANGGU[beat], nextT);
        if (beat === 0) pluck(BASS[Math.floor(step / 9) % BASS.length] - 12, nextT, 9 * EIGHTH, .16);
        nextT += EIGHTH;
        step = (step + 1) % TOTAL;
      }
    }
    function bgmStart() {
      if (!ctx || timer) return;
      nextT = ctx.currentTime + 0.1; step = 0;
      const t = ctx.currentTime;
      bgmBus.gain.cancelScheduledValues(t);
      bgmBus.gain.setValueAtTime(0.0001, t);
      bgmBus.gain.exponentialRampToValueAtTime(BGM_VOL, t + 1.5);
      schedule();
      timer = setInterval(schedule, 60);
    }
    function bgmStop() {
      if (!ctx || !timer) return;
      const t = ctx.currentTime;
      bgmBus.gain.cancelScheduledValues(t);
      bgmBus.gain.setValueAtTime(Math.max(bgmBus.gain.value, 0.0001), t);
      bgmBus.gain.exponentialRampToValueAtTime(0.0001, t + .4);
      clearInterval(timer); timer = null;
    }

    return {
      ...SFX,
      unlock() {
        if (!init()) return;
        if (ctx.state === 'suspended') ctx.resume();
      },
      synthStart() { if (!init()) return; if (ctx.state === 'suspended') ctx.resume(); bgmStart(); },
      synthStop: bgmStop,
      get sfxOn() { return sfxOn; },
      toggleSfx() { sfxOn = !sfxOn; store.set('yut.sfx', sfxOn); },
    };
  })();

  // ================= 배경음 소스 =================
  // 1순위: 요청한 유튜브 곡(공식 임베드 플레이어) · 2순위: 사용자가 고른 음악 파일 · 대체: 가야금 합성 배경음
  const Music = (() => {
    const YT_ID = 'l-vSSYEuO88', YT_START = 53, YT_VOL = 45;
    let on = store.get('yut.bgm', true);
    let src = 'yt', ytState = 'loading', player = null, fileAudio = null, wanted = false;
    function fail() {
      if (ytState === 'failed') return;
      ytState = 'failed';
      $('ytWrap').hidden = true;
      if (src === 'yt') { src = 'synth'; if (wanted && on) Sound.synthStart(); }
      refresh();
    }
    function loadYT() {
      window.onYouTubeIframeAPIReady = () => {
        try {
          player = new YT.Player('ytHost', {
            videoId: YT_ID, width: 128, height: 72,
            playerVars: { start: YT_START, playsinline: 1, rel: 0, controls: 1 },
            events: {
              onReady() {
                ytState = 'ready'; $('ytWrap').hidden = false; player.setVolume(YT_VOL);
                if (wanted && on && src === 'yt') player.playVideo();
                refresh();
              },
              onError: fail,
              onStateChange(e) { if (e.data === 0) { player.seekTo(YT_START, true); player.playVideo(); } },
            },
          });
        } catch { fail(); }
      };
      const sc = document.createElement('script');
      sc.src = 'https://www.youtube.com/iframe_api';
      sc.onerror = fail;
      document.head.appendChild(sc);
      setTimeout(() => { if (ytState === 'loading') fail(); }, 8000);
    }
    function start() {
      wanted = true;
      if (!on) return;
      if (src === 'file' && fileAudio) fileAudio.play().catch(() => {});
      else if (src === 'yt') { if (ytState === 'ready') player.playVideo(); }
      else Sound.synthStart();
    }
    function stop() {
      Sound.synthStop();
      try { player && player.pauseVideo(); } catch {}
      if (fileAudio) fileAudio.pause();
    }
    function refresh() {
      const b = $('bgmBtn');
      if (!b) return;
      b.setAttribute('aria-pressed', String(on));
      b.title = src === 'yt' ? '배경음: 유튜브 곡' : src === 'file' ? '배경음: 고른 음악 파일' : '배경음: 가야금·장구 (유튜브를 불러올 수 없는 환경)';
    }
    return {
      loadYT, refresh,
      get on() { return on; },
      get wanted() { return wanted; },
      start,
      toggle() { on = !on; store.set('yut.bgm', on); if (on) start(); else stop(); refresh(); },
      setFile(file) {
        stop();
        if (fileAudio) URL.revokeObjectURL(fileAudio.src);
        fileAudio = new Audio(URL.createObjectURL(file));
        fileAudio.loop = true; fileAudio.volume = .5;
        src = 'file'; on = true; store.set('yut.bgm', true);
        start(); refresh();
      },
      duck() {
        if (!on) return;
        if (src === 'synth') Sound.duck();
        else if (src === 'yt' && ytState === 'ready') { player.setVolume(10); setTimeout(() => player.setVolume(YT_VOL), 1300); }
        else if (src === 'file' && fileAudio) { fileAudio.volume = .12; setTimeout(() => { fileAudio.volume = .5; }, 1300); }
      },
    };
  })();

  // ================= 윷판 좌표 =================
  // 바깥 0..19 : 참먹이(오른쪽 아래)에서 반시계 방향
  // 20,21 → 22(방) → 23,24 : 모(5) → 찌모(15) 대각선
  // 25,26 → 22(방) → 27,28 : 뒷모(10) → 참먹이(0) 대각선
  const A = 70, B = 530, STEP = (B - A) / 5, C = 300;
  const POS = {};
  for (let i = 0; i < 5; i++) {
    POS[i] = [B, B - i * STEP];
    POS[i + 5] = [B - i * STEP, A];
    POS[i + 10] = [A, A + i * STEP];
    POS[i + 15] = [A + i * STEP, B];
  }
  const lerp = (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
  const CEN = [C, C];
  POS[20] = lerp([B, A], CEN, 1 / 3); POS[21] = lerp([B, A], CEN, 2 / 3);
  POS[22] = CEN;
  POS[23] = lerp(CEN, [A, B], 1 / 3); POS[24] = lerp(CEN, [A, B], 2 / 3);
  POS[25] = lerp([A, A], CEN, 1 / 3); POS[26] = lerp([A, A], CEN, 2 / 3);
  POS[27] = lerp(CEN, [B, B], 1 / 3); POS[28] = lerp(CEN, [B, B], 2 / 3);
  const BIG = new Set([0, 5, 10, 15, 22]);
  const BACK = { 0: 19, 20: 5, 21: 20, 22: 21, 23: 22, 24: 23, 25: 10, 26: 25, 27: 22, 28: 27 };
  for (let i = 1; i < 20; i++) BACK[i] = i - 1;

  function nextNode(node, prev, first) {
    if (node === HOME) return 1;
    if (node === 0) return FIN;
    if (first) {
      if (node === 5) return 20;
      if (node === 10) return 25;
      if (node === 22) return 27;
    }
    if (node >= 1 && node <= 18) return node + 1;
    switch (node) {
      case 19: return FIN;
      case 20: return 21;
      case 21: return 22;
      case 22: return prev === 21 ? 23 : 27;
      case 23: return 24;
      case 24: return 15;
      case 25: return 26;
      case 26: return 22;
      case 27: return 28;
      case 28: return FIN;
    }
    return FIN;
  }

  function pathFor(piece, steps) {
    const h = piece.hist;
    if (steps < 0) {
      if (piece.node === HOME || piece.node === FIN) return null;
      return [h.length >= 2 ? h[h.length - 2] : BACK[piece.node]];
    }
    const path = [];
    let cur = piece.node, prev = h.length >= 2 ? h[h.length - 2] : undefined;
    for (let i = 0; i < steps; i++) {
      const nx = nextNode(cur, prev, i === 0);
      path.push(nx);
      if (nx === FIN) break;
      prev = cur; cur = nx;
    }
    return path;
  }

  // ================= 송편 그림 =================

  }
  const songSVG = (t, count) => `<svg viewBox="-22 -20 44 34" aria-hidden="true">${songpyeon(t, count)}</svg>`;
  const CROSS = `<svg class="x" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="#F0506E" stroke-width="1.8"/><path d="M8 0v5M8 11v5M0 8h5M11 8h5" stroke="#F0506E" stroke-width="1.8"/></svg>`;

  // ================= 상태 =================
  let S;
  let chosenN = 2;
  const nm = t => (S && S.names && S.names[t]) || TEAMS[t].name;
  function newGame(n, names) {
    S = { n, names: names || TEAMS.slice(0, n).map(t => t.name), pieces: [], current: 0, pending: 1, results: [], sel: 0, busy: false, winner: null, log: [], kills: Array(n).fill(0), streak: 0, flying: [] };
    for (let t = 0; t < n; t++)
      for (let k = 0; k < PIECES; k++) S.pieces.push({ id: t * PIECES + k, team: t, node: HOME, hist: [] });
    addLog(0, `${n}팀으로 새 게임을 시작합니다. ${nm(0)}부터!`);
  }
  function addLog(team, text, kill) {
    S.log.unshift({ team, text, kill: !!kill });
    S.log.length = Math.min(S.log.length, 40);

  const teamPieces = t => S.pieces.filter(p => p.team === t);

  const stepsOf = r => Number(r);
  function usable(team, steps) {

  // ================= 윷가락 =================

  // 게이지 구간별 결과 가중치 · 순서: 빽도, 도, 개, 걸, 윷, 모
  const ZONES = [

  // ================= 판 그리기 =================

  function dduksal(x, y, r, parent) {

  function isMovePhase() { return S.winner === null && !S.busy && S.pending === 0 && S.results.length > 0; }

  function renderPieces() {

  function reticle(parent, x, y, withLabel) {

  let lastAimed = null;
  function showGhost(piece) {

  function hideGhost() { if (ghostLayer) ghostLayer.innerHTML = ''; lastAimed = null; }

  // ================= 타격 연출 =================
  const card = $('boardCard');
  const canvas = $('fx');
  const cx2d = canvas.getContext('2d');
  let parts = [], rafOn = false;
  function boardToCard(node) {
    const r = svg.getBoundingClientRect(), c = card.getBoundingClientRect();
    const [x, y] = POS[node];
    return [r.left - c.left + x / 600 * r.width, r.top - c.top + y / 600 * r.height];
  }
  function boardToClient(node) {
    const r = svg.getBoundingClientRect();

    return [r.left + x / 600 * r.width, r.top + y / 600 * r.height];

  function burst(node, colors, n = 46, power = 1) {
    if (reduced) return;
    const dpr = window.devicePixelRatio || 1;
    const w = card.clientWidth, h = card.clientHeight;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);

    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 7) * power;
      const spark = i % 3 === 0;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, life: 1, decay: .018 + Math.random() * .02,
        r: spark ? 2 : 3 + Math.random() * 4, spark, color: spark ? '#FFF6C8' : colors[i % colors.length], rot: Math.random() * 6 });
    }

  function tick() {
    cx2d.clearRect(0, 0, canvas.width, canvas.height);

    for (const p of parts) {
      p.life -= p.decay;
      cx2d.globalAlpha = Math.max(p.life, 0);
      if (p.ring) {
        p.r += 9;
        cx2d.strokeStyle = '#F0506E'; cx2d.lineWidth = 5 * p.life;

  async function lockOn(node) {

      { duration: reduced ? 60 : 330, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'forwards' });
    await sleep(380);
    return g;
  }
  function bigText(text, sub, ms = 1300) {
    const el = $('hit');
    $('hitText').textContent = text;
    $('hitSub').textContent = sub;
    el.animate([
      { transform: 'translate(-50%,-50%) scale(2.4) rotate(-8deg)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scale(.94) rotate(0deg)', opacity: 1, offset: .18 },
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .8 },
      { transform: 'translate(-50%,-60%) scale(1.04)', opacity: 0 },
    ], { duration: ms, easing: 'ease-out', fill: 'forwards' });
  }
  function killfeed(team, victims) {
    const kf = $('killfeed');
    const row = document.createElement('div');
    row.className = 'kf';
    const vt = [...new Set(victims.map(v => v.team))];
    row.innerHTML = `${songSVG(team)}<span></span>${CROSS}${vt.map(t => songSVG(t, victims.filter(v => v.team === t).length)).join('')}<span></span>`;
    row.children[1].textContent = nm(team);
    row.lastElementChild.textContent = vt.map(t => nm(t)).join(', ');
    kf.prepend(row);
    while (kf.children.length > 4) kf.lastChild.remove();
    row.animate([{ transform: 'translateX(40px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 220, easing: 'ease-out' });
    setTimeout(() => row.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }).finished.then(() => row.remove()), 3600);
  }
  async function flyBack(victims, fromNode) {
    const [sx, sy] = boardToClient(fromNode);
    const flights = victims.map((v, i) => {
      const target = document.querySelector(`[data-pid="${v.id}"]`);
      if (!target) return Promise.resolve();
      const tr = target.getBoundingClientRect();
      const tx = tr.left + tr.width / 2, ty = tr.top + tr.height / 2;
      const el = document.createElement('div');
      el.className = 'flyer';
      el.innerHTML = songSVG(v.team);
      document.body.appendChild(el);
      const mx = (sx + tx) / 2, my = Math.min(sy, ty) - 140;
      return el.animate([
        { transform: `translate(${sx}px,${sy}px) scale(1.5) rotate(0deg)` },
        { transform: `translate(${mx}px,${my}px) scale(1.2) rotate(${360 + i * 60}deg)`, offset: .45 },
        { transform: `translate(${tx}px,${ty}px) scale(.9) rotate(${720}deg)` },
      ], { duration: reduced ? 80 : 720 + i * 90, easing: 'cubic-bezier(.3,.1,.3,1)', fill: 'forwards' }).finished.then(() => el.remove());
    });
    await Promise.all(flights);
  }

  async function impact(dest, team, victims) {
    Music.duck();
    Sound.shot(); Sound.hitmarker();
    flash(); shake(victims.length > 1 ? 18 : 13);
    const colors = [...new Set(victims.map(v => TEAMS[v.team].color)), '#FFFFFF'];
    burst(dest, colors, 40 + victims.length * 14, victims.length > 1 ? 1.3 : 1);
    hitmarker(dest);
    S.kills[team] += victims.length;
    S.streak += victims.length;
    const n = victims.length;
    const MULTI = ['', '', '더블 킬!', '트리플 킬!', '쿼드라 킬!'];
    let text = '잡았다!';
    if (n >= 2) { text = MULTI[Math.min(n, 4)]; Sound.multi(n); }
    else if (S.streak >= 2) text = `${S.streak}연속 잡기!`;
    bigText(text, '한 번 더 던져요!');
    Sound.oneMore();
    killfeed(team, victims);
    await sleep(260);
    victims.forEach(v => { v.node = HOME; v.hist = []; });
    S.flying = victims.map(v => v.id);
    render();
    Sound.whistle();
    await flyBack(victims, dest);
    S.flying = [];
  }

  // ================= 진행 =================
  async function doThrow() {
    if (!S || S.busy || S.pending <= 0 || S.winner !== null || setupOpen) return;
    const power = gauge.power;
    S.busy = true; S.pending--; render();
    const { flats, r } = rollByPower(power);
    await animateThrow(flats, power);
    await showResultPop(r, power);
    S.results.push(r);
    S.sel = S.results.length - 1;
    if (r >= 4) S.pending++;
    addLog(S.current, `${nm(S.current)}: ${RESULT[r].name}${r >= 4 ? ' — 한 번 더 던집니다' : ''}`);
    S.busy = false;
    advance();
  }

  function advance() {
    if (S.winner !== null) return render();
    if (S.pending > 0) return render();
    const dropped = S.results.filter(r => !usable(S.current, stepsOf(r)));
    S.results = S.results.filter(r => usable(S.current, stepsOf(r)));
    if (dropped.length)
      addLog(S.current, `${nm(S.current)}: 판 위에 말이 없어 ${dropped.map(r => RESULT[r].name).join(', ')} 무효`);
    if (!S.results.length) return nextTurn();
    S.sel = Math.min(S.sel, S.results.length - 1);
    render();
  }

  function nextTurn() {
    S.current = (S.current + 1) % S.n;
    S.pending = 1; S.results = []; S.sel = 0; S.streak = 0;
    render();
  }

  async function movePiece(pieceId) {
    if (S.busy || S.pending > 0 || !S.results.length || S.winner !== null) return;
    const lead = S.pieces.find(p => p.id === pieceId);
    if (!lead || lead.team !== S.current) return;
    const r = S.results[S.sel];
    const steps = stepsOf(r);
    const group = lead.node === HOME ? [lead] : S.pieces.filter(p => p.team === lead.team && p.node === lead.node);
    const path = pathFor(lead, steps);
    if (!path) return;
    S.busy = true;
    hideGhost();
    const dest = path[path.length - 1];
    const targets = enemiesAt(dest, lead.team);
    let reticleEl = null;
    for (let i = 0; i < path.length; i++) {
      if (i === path.length - 1 && targets.length) { render(); reticleEl = await lockOn(dest); }
      group.forEach(p => { p.node = path[i]; });
      render();
      Sound.step(i);
      await sleep(i === path.length - 1 && targets.length ? 90 : 190);
    }
    let hist = lead.hist.slice();
    if (steps < 0) {
      if (hist.length >= 2) hist.pop(); else hist = [dest];
    } else {
      hist.push(...path.filter(n => n !== FIN));
    }
    const team = nm(lead.team);
    const carried = group.length > 1 ? ` (${group.length}개 업고)` : '';
    if (dest === FIN) {
      group.forEach(p => { p.node = FIN; p.hist = []; });
      addLog(lead.team, `${team}: ${RESULT[r].name}로 ${group.length}개 말 완주${carried}`);
      Sound.finish();
      burst(0, ['#FFD65C', '#FFF3DA', TEAMS[lead.team].color], 36, .9);
    } else {
      const victims = S.pieces.filter(p => p.node === dest && p.team !== lead.team);
      const stacked = S.pieces.filter(p => p.node === dest && p.team === lead.team && !group.includes(p));
      S.pieces.filter(p => p.team === lead.team && p.node === dest).forEach(p => { p.hist = hist.slice(); });
      let msg = `${team}: ${RESULT[r].name}로 이동${carried}`;
      if (stacked.length) { msg += ' — 우리 말을 업었어요'; Sound.stack(); }
      if (victims.length) {
        const names = [...new Set(victims.map(v => nm(v.team)))].join(', ');
        addLog(lead.team, `${team}: ${names} ${victims.length}개 잡음! 한 번 더`, true);
        await impact(dest, lead.team, victims);
        S.pending++;
      } else addLog(lead.team, msg);
    }
    if (reticleEl) reticleEl.remove();
    S.results.splice(S.sel, 1);
    S.sel = 0;
    if (teamPieces(lead.team).every(p => p.node === FIN)) {
      S.winner = lead.team;
      addLog(lead.team, `${team} 승리!`);
      Sound.win();
      bigText(`${team} 승리!`, '보름달처럼 꽉 찬 한 판', 2600);
      [0, 5, 10, 15, 22].forEach((n, i) => setTimeout(() => burst(n, TEAMS.slice(0, S.n).map(t => t.color).concat('#FFD65C'), 30, 1.1), i * 180));
    }
    S.busy = false;
    advance();
  }

  // ================= 패널 렌더 =================
  function render() {
    renderPieces();
    const tc = $('turnCard');
    tc.innerHTML = '';
    const turn = document.createElement('div');
    turn.className = 'turn';
    const who = S.winner !== null ? S.winner : S.current;
    turn.innerHTML = `${songSVG(who)}<div><div class="turn-name"></div><div class="status"></div></div>`;
    let status;
    if (S.winner !== null) status = '네 송편이 모두 참먹이를 지났어요.';
    else if (S.busy) status = '움직이는 중…';
    else if (S.pending > 0) status = S.results.length ? '한 번 더! 게이지를 보고 스페이스바.' : '게이지를 보고 스페이스바를 누르세요.';
    else status = '결과를 고르고 움직일 송편을 누르세요.';
    turn.querySelector('.turn-name').textContent = S.winner !== null ? `${nm(who)} 승리!` : `${nm(who)} 차례`;
    turn.querySelector('.status').textContent = status;
    tc.appendChild(turn);
    if (S.winner !== null) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn primary'; b.textContent = '다시 하기';
      b.onclick = () => openSetup(false);
      turn.appendChild(b);
    }

    $('throwBtn').disabled = S.busy || S.pending <= 0 || S.winner !== null;
    $('pending').innerHTML = S.winner !== null ? '게임 끝' : `남은 던지기 <strong>${S.pending}</strong>`;

    const rs = $('results');
    rs.innerHTML = '';
    if (!S.results.length) {
      const e = document.createElement('span'); e.className = 'empty'; e.textContent = '나온 결과가 여기에 쌓여요.'; rs.appendChild(e);
    }
    S.results.forEach((r, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'res' + (r < 0 ? ' back' : '');
      b.setAttribute('aria-pressed', String(i === S.sel));
      b.innerHTML = `${RESULT[r].name}<small>${r < 0 ? '-1' : '+' + r}</small>`;
      b.disabled = S.busy;
      b.onclick = () => { S.sel = i; Sound.click(); render(); };
      rs.appendChild(b);
    });

    const teams = $('teams');
    teams.innerHTML = '';
    const steps = S.results.length ? stepsOf(S.results[S.sel]) : 0;
    for (let ti = 0; ti < S.n; ti++) {
      const tm = TEAMS[ti];
      const ps = teamPieces(ti);
      const done = ps.filter(p => p.node === FIN).length;
      const row = document.createElement('div');
      row.className = 'team' + (ti === S.current && S.winner === null ? ' now' : '');
      row.style.setProperty('--team', tm.edge);
      row.innerHTML = `<span class="team-name"><span class="tn"></span><small>${tm.name}</small></span>
        <span class="score"><span>잡음 <b>${S.kills[ti] || 0}</b></span><span>완주 <b>${done}/4</b></span></span>`;
      row.querySelector('.tn').textContent = nm(ti);
      if (nm(ti) === tm.name) row.querySelector('.team-name small').hidden = true;
      const home = document.createElement('div');
      home.className = 'home';
      let firstHome = true;
      for (const p of ps) {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.pid = p.id;
        b.innerHTML = songSVG(ti);
        if (p.node === HOME) {
          b.className = 'hp' + (S.flying.includes(p.id) ? ' incoming' : '');
          const can = firstHome && isMovePhase() && ti === S.current && steps > 0;
          firstHome = false;
          b.setAttribute('aria-label', `${nm(ti)} 대기 말${can ? ' — 출발시키기' : ''}`);
          if (can) {
            b.classList.add('movable');
            b.onclick = () => movePiece(p.id);
            b.onmouseenter = () => showGhost(p);
            b.onmouseleave = hideGhost;
          } else b.disabled = true;
        } else if (p.node === FIN) {
          b.className = 'hp done'; b.disabled = true; b.setAttribute('aria-label', `${nm(ti)} 완주한 말`);
        } else {
          b.className = 'hp out'; b.disabled = true; b.setAttribute('aria-label', `${nm(ti)} 판 위의 말`);
        }
        home.appendChild(b);
      }
      row.appendChild(home);
      teams.appendChild(row);
    }
    Music.refresh();
    $('sfxBtn').setAttribute('aria-pressed', String(Sound.sfxOn));
  }

  function fullRender() {
    sticks.forEach(s => { s.el.style.transform = ''; });
    drawSticks();
    render();
  }

  // ================= 힘 게이지 =================
  const gauge = { power: 0, t0: performance.now() };
  const PERIOD = 1300;
  function gaugeLoop(now) {
    const active = S && !S.busy && S.pending > 0 && S.winner === null && !setupOpen;
    if (active) {
      const ph = ((now - gauge.t0) % PERIOD) / PERIOD;
      gauge.power = (ph < .5 ? ph * 2 : 2 - ph * 2) * 100;
      $('needle').style.left = gauge.power + '%';
      $('zoneLabel').textContent = zoneOf(gauge.power).name;
    } else gauge.t0 = now;
    $('gauge').classList.toggle('idle', !active);
    requestAnimationFrame(gaugeLoop);
  }

  // ================= 새 게임 설정 =================
  let setupOpen = false;
  let savedNames = store.get('yut.names', []);
  function renderSetup() {
    document.querySelectorAll('#teamSeg button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.n) === chosenN)));
    const list = $('nameList');
    list.innerHTML = '';
    for (let t = 0; t < chosenN; t++) {
      const row = document.createElement('label');
      row.className = 'name-row';
      row.htmlFor = 'name' + t;
      row.innerHTML = `${songSVG(t)}<span>${TEAMS[t].name}</span><input id="name${t}" maxlength="10" autocomplete="off">`;
      const inp = row.querySelector('input');
      inp.placeholder = `${t + 1}팀 닉네임`;
      inp.value = savedNames[t] || '';
      inp.addEventListener('input', () => { savedNames[t] = inp.value; });
      list.appendChild(row);
    }
  }
  function openSetup(first) {
    setupOpen = true;
    chosenN = S ? S.n : chosenN;
    $('setupCancel').hidden = !!first;
    renderSetup();
    $('setup').hidden = false;
    setTimeout(() => { const i = $('name0'); if (i) i.focus(); }, 30);
  }
  function closeSetup() { setupOpen = false; $('setup').hidden = true; }
  document.querySelectorAll('#teamSeg button').forEach(b => b.addEventListener('click', () => {
    chosenN = Number(b.dataset.n);
    Sound.click();
    renderSetup();
  }));
  $('setupForm').addEventListener('submit', e => {
    e.preventDefault();
    if (S && S.busy) return;
    const names = [];
    for (let t = 0; t < chosenN; t++) names.push(($('name' + t).value || '').trim() || TEAMS[t].name);
    store.set('yut.names', savedNames);
    newGame(chosenN, names);
    closeSetup();
    fullRender();
    Sound.click();
  });
  $('setupCancel').addEventListener('click', closeSetup);

  // ================= 조작 =================
  const firstGesture = () => { Sound.unlock(); if (!Music.wanted) Music.start(); };
  document.addEventListener('pointerdown', firstGesture, true);
  document.addEventListener('keydown', firstGesture, true);
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.key !== ' ') return;
    if (setupOpen || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    e.preventDefault();
    if (popDone) { popDone(); return; }
    if (!e.repeat) doThrow();
  });
  $('resultPop').addEventListener('click', () => { if (popDone) popDone(); });
  $('throwBtn').addEventListener('click', doThrow);
  $('bgmBtn').addEventListener('click', () => Music.toggle());
  $('fileBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) Music.setFile(f); e.target.value = ''; });
  $('sfxBtn').addEventListener('click', () => { Sound.toggleSfx(); Sound.click(); render(); });
  $('newGame').addEventListener('click', () => { Sound.click(); openSetup(false); });
  $('fsBtn').addEventListener('click', () => {
    const d = document;
    try {
      if (d.fullscreenElement) d.exitFullscreen().catch(() => {});
      else d.documentElement.requestFullscreen().catch(() => {});
    } catch {}
  });
  document.addEventListener('fullscreenchange', () => { $('fsBtn').setAttribute('aria-pressed', String(!!document.fullscreenElement)); });

  // ================= 시작 =================
  drawBoard();
  Music.loadYT();
  requestAnimationFrame(gaugeLoop);
  const boot = data => {
    if (data && data.S && data.S.kills && data.S.names) { S = data.S; S.busy = false; S.flying = []; chosenN = S.n; fullRender(); }
    else { newGame(chosenN); fullRender(); openSetup(true); }
  };
  window.claude?.hot?.snapshot?.(() => ({ S }));
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
